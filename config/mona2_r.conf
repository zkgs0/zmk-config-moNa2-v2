#Mouse config ---------------------
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

#Prospector Scanner (status advertisement) -------------------
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="moNa2"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"

# ── 省電力設定 (2026-08-13) ──
# ディープスリープ: 無操作20分でsystem-off。キー押下で起床(BLE再接続1〜2秒)。
# トラックボール移動はactivity.cのINPUT_CALLBACK(CONFIG_ZMK_POINTING)で
# アクティビティ扱いされるため、マウス使用中に眠ることはない。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

# PMW3610 Restモード調整: Rest3(0.5秒サンプリング)到達を約22秒→約5分に延長、
# Rest3のサンプリングも500→300msへ短縮 (ボール放置後の初動ラグ緩和)。
# Rest3到達 = RUN_DOWNSHIFT(128ms) + REST1_DOWNSHIFT(5s) + 下記(12.8秒単位に量子化で実効約4分54秒)
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=300000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
